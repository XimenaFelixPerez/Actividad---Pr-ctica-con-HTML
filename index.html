<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Mi Pagina Web</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="tags.html">Tags</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="archivo.html">Imagenes</a></li>
                </ul>
            </div>
            </div>
    </nav>

    <div class="container">
        <div class="login-box">
            <h1>Formulario de Login</h1>
            <p id="parrafo-destacado">Ingresa tus datos para continuar.</p>

            <label for="usuario">Usuario:</label>
            <input type="text" class="form-control" id="usuario" name="usuario">
            <br>

            <label for="contrasena">Contraseña:</label>
            <input type="password" class="form-control" id="contrasena" name="contraseña">
            <br>

            <button class="btn btn-outline-primary">Registrarme</button>

            <button class="btn btn-primary" onclick="login()">Iniciar Sesión</button>

            <script>
            function login() {
                let usuario = document.getElementById("usuario").value;
                let contrasena = document.getElementById("contrasena").value;

                if (usuario == "ximena" && contrasena == "12345") {
                    window.location.href = "index.html";
                } else {
                    alert("Usuario o contraseña incorrectos");
                }
            }
            </script>

        </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
