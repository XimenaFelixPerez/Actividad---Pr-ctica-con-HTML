    <div class="container">
        <div class="login-box">
            <h1>Formulario de Login</h1>
            <p id="parrafo-destacado">Ingresa tus datos para continuar.</p>

            <div id="camposRegistro" style="display:none;">
                <label for="nombre">Nombre:</label>
                <input type="text" class="form-control" id="nombre">
                <br>

                <label for="apellido">Apellido:</label>
                <input type="text" class="form-control" id="apellido">
                <br>
            </div>

            <label for="email">Correo:</label>
            <input type="email" class="form-control" id="email">
            <br>

            <label for="contrasena">Contraseña:</label>
            <input type="password" class="form-control" id="contrasena">
            <br>

            <button class="btn btn-outline-primary" id="btnRegistro">Registrarme</button>
            <button class="btn btn-primary" id="btnLogin">Iniciar Sesión</button>
        </div>
