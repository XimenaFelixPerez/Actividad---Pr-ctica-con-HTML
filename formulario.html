<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Mi Pagina Web</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="tags.html">Tags</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="archivo.html">Imagenes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Formulario</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow" style="max-width: 500px; margin: 0 auto;">
            <div class="card-body">
                <h3 class="card-title mb-4">Formulario</h3>

                <form>
                    <p class="fw-bold">Tipo de usuario:</p>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo" value="estudiante" id="radioEstudiante">
                        <label class="form-check-label" ">Estudiante</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="tipo" value="profesor" id="radioProfesor">
                        <label class="form-check-label" >Profesor</label>
                    </div>

                    <div id="contenidoOculto" class="alert alert-info" style="display: none;">
                        Contenido adicional para tu selección.
                    </div>

                    <div class="mb-3">
                        <label for="paisSelect" class="form-label">País:</label>
                        <select id="paisSelect" class="form-select">
                            <option value="">Selecciona un país</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="regionSelect" class="form-label">Región:</label>
                        <select id="regionSelect" class="form-select" disabled>
                            <option value="">Selecciona una región</option>
                        </select>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="chk1">
                        <label class="form-check-label" for="chk1">Acepto términos</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="chk2">
                        <label class="form-check-label" for="chk2">Confirmo mis datos</label>
                    </div>

                    <button id="btnConfirmar" type="button" class="btn btn-primary w-100" disabled>Confirmar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="form.js"></script>
</body>
</html>
